</script>
<style>
:root{
  color-scheme: light;
  /* shared "Utility" neutrals; app accent = steel/gunmetal */
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#f6f7f9; --surface-3:#eceef2; --border:#dfe2e7; --border-2:#c6cbd3;
  --text:#1b1f24; --text-2:#48505c; --muted:#5f6773;
  --accent:#256b8f; --accent-strong:#1b5370; --accent-soft:#e4eff5; --on-accent:#ffffff; --accent-line:rgba(37,107,143,.38);
  --ok:#1f7a3d; --ok-soft:#e3f2e8; --warn:#9a5c00; --warn-soft:#fbefd9; --bad:#b8322b; --bad-soft:#fbe5e3;
  /* chart series: steel-blue lead + validated companions (light surface) */
  --s1:#256b8f; --s2:#c47d10; --s3:#1f9d93; --s4:#7b5cc4; --s5:#d9677b; --s6:#6f7f2a;
  --grid:#e8eaed; --shadow:0 1px 2px rgba(20,24,31,.06); --on-bad:#ffffff;
  --r:6px; --r-sm:4px; --ctl:38px; --ctl-sm:32px; --ease:120ms ease;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  --shadow-pop:0 8px 24px -6px rgba(20,24,31,.22),0 1px 3px rgba(20,24,31,.08); --hover-band:rgba(20,24,31,.045);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#16181c; --surface:#1e2126; --surface-2:#25292f; --surface-3:#2d3238; --border:#30353c; --border-2:#434a53;
    --text:#e9ecf0; --text-2:#b4bbc5; --muted:#8e97a3;
    --accent:#7db6d4; --accent-strong:#a6cde3; --accent-soft:#1f323d; --on-accent:#08161e; --accent-line:rgba(125,182,212,.45);
    --ok:#56c585; --ok-soft:#173226; --warn:#e5a740; --warn-soft:#3a2b12; --bad:#f07a70; --bad-soft:#3d1c1a;
    --s1:#5ba3c9; --s2:#bb7f14; --s3:#22a095; --s4:#8e7ae0; --s5:#d0637c; --s6:#6c8a2a;
    --grid:#2b3037; --shadow:0 1px 2px rgba(0,0,0,.3); --on-bad:#1c0c0b;
    --shadow-pop:0 10px 28px -6px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03); --hover-band:rgba(255,255,255,.05);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#16181c; --surface:#1e2126; --surface-2:#25292f; --surface-3:#2d3238; --border:#30353c; --border-2:#434a53;
  --text:#e9ecf0; --text-2:#b4bbc5; --muted:#8e97a3;
  --accent:#7db6d4; --accent-strong:#a6cde3; --accent-soft:#1f323d; --on-accent:#08161e; --accent-line:rgba(125,182,212,.45);
  --ok:#56c585; --ok-soft:#173226; --warn:#e5a740; --warn-soft:#3a2b12; --bad:#f07a70; --bad-soft:#3d1c1a;
  --s1:#5ba3c9; --s2:#bb7f14; --s3:#22a095; --s4:#8e7ae0; --s5:#d0637c; --s6:#6c8a2a;
  --grid:#2b3037; --shadow:0 1px 2px rgba(0,0,0,.3); --on-bad:#1c0c0b;
  --shadow-pop:0 10px 28px -6px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03); --hover-band:rgba(255,255,255,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.vsel{max-width:240px;min-width:0;padding:8px 32px 8px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);font-weight:600;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--text-2)}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}

main{max-width:1120px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:22px;margin:0;letter-spacing:-.015em}
h2{font-size:16px;margin:0;letter-spacing:-.01em}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sub{color:var(--text-2);font-size:14px;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.card-h .sub{margin:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.tile{padding:14px 16px}
.tile .lbl{font-size:13px;color:var(--text-2)}
.tile .val{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.tile .note{font-size:12.5px;color:var(--muted);margin-top:2px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid>*,.tiles>*,.vcards>*{min-width:0}
.more{display:block;width:100%;border:0;border-top:1px solid var(--border);background:none;padding:11px;cursor:pointer;color:var(--accent-strong);font-weight:600;border-radius:0 0 var(--r) var(--r)}
.more:hover{background:var(--surface-2)}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-2);background:var(--surface);padding:8px 13px;border-radius:9px;cursor:pointer;font-weight:550;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.pri:hover{background:var(--accent-strong)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.danger{color:var(--bad);border-color:var(--border-2)}
.btn .i{width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;padding:2px;background:var(--surface-2)}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--text-2);font-weight:500}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}

/* hero */
.hero{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero .odo{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.hero .odo small{font-size:16px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.vtitle{font-size:20px;font-weight:700;letter-spacing:-.015em}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12.5px;padding:3px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2)}

/* list rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--border)}
.row:first-child{border-top:0}
.row.click{cursor:pointer}
.row.click:hover{background:var(--surface-2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600}
.row .m{font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:600;text-align:right;white-space:nowrap}
.ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent-strong)}
.ic .i{width:17px;height:17px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill .i{width:13px;height:13px;stroke-width:2.4}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.over{background:var(--bad-soft);color:var(--bad)}
.pill.unk{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.pill.neutral{background:var(--accent-soft);color:var(--accent-strong)}
.meter{height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;margin-top:7px}
.meter span{display:block;height:100%;border-radius:99px;background:var(--accent)}
.meter.soon span{background:var(--warn)} .meter.over span{background:var(--bad)} .meter.ok span{background:var(--ok)}

/* tables */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--text-2);font-size:12.5px;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
td .m{color:var(--text-2);font-size:12.5px}

.empty{padding:28px 16px;text-align:center;color:var(--text-2)}
.empty b{display:block;color:var(--text);margin-bottom:4px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{padding:7px 11px;border:1px solid var(--border);border-radius:9px;background:var(--surface);min-width:0;width:200px}

/* charts */
.chart{position:relative;padding:8px 12px 10px}
.chart svg{display:block;width:100%;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);padding:10px 16px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.axis{font-size:11px;fill:var(--muted)}
.dlabel{font-size:12px;fill:var(--text);font-weight:600}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);border:1px solid var(--border-2);box-shadow:0 6px 24px rgba(0,0,0,.14);border-radius:9px;padding:8px 10px;font-size:12.5px;min-width:120px;display:none}
#tip .tl{font-weight:650;margin-bottom:3px}
#tip .tr{display:flex;gap:10px;justify-content:space-between;color:var(--text-2)}
#tip .tr b{color:var(--text);font-weight:600}
#tip .tr i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}
.hbar{display:flex;align-items:center;gap:10px;padding:8px 16px}
.hbar .nm{width:130px;font-size:13.5px;display:flex;align-items:center;gap:8px;flex:none}
.hbar .nm i{width:10px;height:10px;border-radius:3px;flex:none}
.hbar .trk{flex:1;height:14px;position:relative}
.hbar .trk span{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;min-width:2px}
.hbar .v{width:88px;text-align:right;font-weight:600;font-size:13.5px}
.hbar .p{width:40px;text-align:right;color:var(--muted);font-size:12.5px}

/* vehicle cards */
.vcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.vcard{padding:16px;display:flex;flex-direction:column;gap:12px}
.vcard .top{display:flex;gap:12px;align-items:flex-start}
.vbadge{width:44px;height:44px;border-radius:11px;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;flex:none}
.vbadge .i{width:24px;height:24px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:13.5px}
.kv div span{display:block;color:var(--muted);font-size:12px}

/* FAB + add sheet */
.fab{position:fixed;right:20px;bottom:24px;z-index:30;display:flex;align-items:center;gap:8px;padding:13px 18px;border-radius:99px;border:0;background:var(--accent);color:var(--on-accent);font-weight:650;box-shadow:0 6px 20px rgba(20,30,40,.25);cursor:pointer}
.fab .i{width:20px;height:20px;stroke-width:2.4}
dialog{border:0;padding:0;border-radius:16px;background:var(--surface);color:var(--text);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,14,18,.5)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-b{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px 12px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--surface)}
.fld{display:flex;flex-direction:column;gap:5px;grid-column:span 2}
.fld.half{grid-column:span 1}
.fld label{font-size:13px;font-weight:600;color:var(--text-2)}
.fld .hint{font-size:12px;color:var(--muted)}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--border-2);border-radius:9px;background:var(--surface)}
.fld textarea{min-height:70px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.search:focus,.vsel:focus{outline:2px solid var(--accent);outline-offset:1px}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer;padding:3px 0}
.chk input{width:17px;height:17px;accent-color:var(--accent)}
.tasks{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);max-height:220px;overflow:auto}
.fld.err input,.fld.err select{border-color:var(--bad)}
.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 18px}
.addgrid button{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:11px;background:var(--surface);cursor:pointer;text-align:left}
.addgrid button:hover{background:var(--surface-2);border-color:var(--border-2)}
.addgrid b{display:block;font-size:14.5px}
.addgrid small{color:var(--text-2);font-size:12.5px}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
.welcome{max-width:560px;margin:40px auto;text-align:center;padding:32px 24px}
.welcome .logo{display:block;width:56px;height:56px;margin:0 auto 14px}
.welcome .logo svg{width:32px;height:32px}
.welcome p{color:var(--text-2)}
.wlist{list-style:none;padding:0;margin:18px auto 0;display:inline-flex;flex-direction:column;gap:9px;text-align:left}
.wlist li{display:flex;gap:9px;align-items:flex-start}
.wlist .i{color:var(--ok);margin-top:2px}
.wsafe{font-size:13.5px;margin:20px 0 0}
.wsafe .i{width:16px;height:16px;color:var(--accent-strong);vertical-align:-3px;margin-right:6px}
.faq .a ul{margin:6px 0 0;padding-left:18px}
.muted{color:var(--muted)}
.skip{position:fixed;left:12px;top:-60px;z-index:100;background:var(--surface);color:var(--text);padding:10px 14px;border-radius:9px;border:2px solid var(--accent);font-weight:600}
.skip:focus{top:12px}
main:focus{outline:none}
.fld .glabel{font-size:13px;font-weight:600;color:var(--text-2)}
.legal{max-width:720px}
.legal h2{margin:22px 0 6px}
.legal p,.legal li{color:var(--text-2);font-size:14.5px}
.legal ul{padding-left:20px;margin:6px 0}
.legal .card{padding:4px 20px 20px}
.legal-links{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.fine{font-size:12.5px;color:var(--muted);margin:14px 2px 0}
.trow{display:flex;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--border)}
.trow .main{flex:1;min-width:0}
.trow .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .m{font-size:12.5px;color:var(--text-2)}
.mt{margin-top:14px}

/* progress, back-to-top */
#progress{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--accent);z-index:2;pointer-events:none}
.totop{position:fixed;right:20px;bottom:88px;z-index:30;width:44px;height:44px;border-radius:99px;border:1px solid var(--border-2);background:var(--surface);color:var(--text-2);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s,background .15s,color .15s}
.totop.on{opacity:1;transform:none;pointer-events:auto}
.totop:hover{background:var(--surface-2);color:var(--text);border-color:var(--muted)}
/* hover + focus states */
.btn,.iconbtn,.fab,.seg button,.addgrid button,.more,.sr,.vsel,.faq summary{transition:background .15s,color .15s,border-color .15s,transform .15s,box-shadow .15s}
.btn:active,.iconbtn:active,.fab:active{transform:translateY(1px)}
.btn.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn.dangerfill{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.btn.dangerfill:hover{filter:brightness(.92);background:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.seg button:hover:not(.on){color:var(--text);background:var(--border)}
.seg button.on:hover{box-shadow:0 1px 4px rgba(0,0,0,.2)}
.fab:hover{background:var(--accent-strong);box-shadow:0 8px 24px rgba(20,30,40,.3)}
.vsel:hover{border-color:var(--border-2)}
.vcard[data-act]:hover{border-color:var(--border-2);box-shadow:0 2px 4px rgba(16,24,32,.08),0 8px 24px rgba(16,24,32,.08)}
button:focus-visible,summary:focus-visible,[data-act]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* loading / entrance animation (view changes only) */
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}}
main.anim>*{animation:rise .28s ease both}
main.anim>*:nth-child(2){animation-delay:.03s} main.anim>*:nth-child(3){animation-delay:.06s} main.anim>*:nth-child(4){animation-delay:.09s} main.anim>*:nth-child(n+5){animation-delay:.12s}
main.anim .chart g.col{transform-box:fill-box;transform-origin:50% 100%;animation:growY .3s cubic-bezier(.2,.7,.2,1) both}
main.anim .chart path.line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .4s ease forwards}
main.anim .chart path.area{animation:fadein .3s ease .1s both}
main.anim .meter span,main.anim .hbar .trk span{transform-origin:left;animation:growX .35s cubic-bezier(.2,.7,.2,1) .05s both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
/* search */
dialog.sdlg{margin-top:8vh}
.sbox{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--border-2);border-radius:10px;padding:0 10px;background:var(--surface-2);color:var(--muted);min-width:0}
.sbox:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.sbox input{flex:1;border:0;background:none;padding:10px 0;outline:none;min-width:0;color:var(--text)}
.sres{max-height:min(62vh,540px);overflow:auto;padding:4px 0 10px}
.sgrp{font-size:11.5px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:12px 18px 4px}
.sr{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:9px 18px;cursor:pointer}
.sr:hover,.sr.on{background:var(--surface-2)}
.sr .body{flex:1;min-width:0}
.sr .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .m{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shint{padding:22px 18px;color:var(--text-2);font-size:14px;text-align:center}
.smore{padding:4px 18px 6px 64px;font-size:12.5px;color:var(--muted)}
mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 1px}
/* FAQ */
.faq-sec{font-size:11.5px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:16px 16px 6px}
.faq details{border-top:1px solid var(--border)}
.faq summary{list-style:none;cursor:pointer;padding:13px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary:hover{background:var(--surface-2)}
.faq summary .i{color:var(--muted);transition:transform .2s}
.faq details[open] summary .i{transform:rotate(180deg)}
.faq .a{padding:0 16px 14px;color:var(--text-2);font-size:14px;max-width:760px}
.faq details[open] .a{animation:rise .2s ease}
/* storage notice */
.notice{position:fixed;left:20px;bottom:24px;z-index:40;max-width:440px;background:var(--surface);border:1px solid var(--border-2);border-radius:14px;box-shadow:0 10px 32px rgba(0,0,0,.18);padding:14px 16px;display:flex;flex-direction:column;gap:10px;animation:rise .3s ease both}
.notice[hidden]{display:none}
.notice .nt{display:flex;gap:12px;align-items:flex-start}
.notice .nt .i{color:var(--accent-strong);margin-top:2px}
.notice p{margin:0;font-size:13.5px;color:var(--text-2)}
.notice p b{color:var(--text)}
.notice .nb{display:flex;gap:8px;justify-content:flex-end}
/* confirm modal */
#cfm{width:min(440px,calc(100vw - 24px))}
.cfm-b{display:flex;gap:14px;padding:20px 20px 16px}
.cfm-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--warn-soft);color:var(--warn)}
.cfm-ic.bad{background:var(--bad-soft);color:var(--bad)}
.cfm-b h2{margin-bottom:6px}
.cfm-b p{margin:0;color:var(--text-2);font-size:14px}
.cfm-b input{margin-top:12px;width:100%;padding:9px 11px;border:1px solid var(--border-2);border-radius:9px;background:var(--surface);letter-spacing:.06em}
.cfm-b input:focus{outline:2px solid var(--accent);outline-offset:1px}

/* onboarding */
.btn{min-height:38px}.btn.sm{min-height:32px}
.btn.lg{min-height:48px;padding:12px 20px;font-size:15px}
.linkbtn{border:0;background:none;color:var(--text-2);cursor:pointer;font-weight:500;text-decoration:underline;text-underline-offset:3px;padding:10px;margin-top:8px;min-height:44px}
.linkbtn:hover{color:var(--text)}
.ob{max-width:540px;margin:16px auto;padding:22px 24px 24px}
.ob .sub{margin-top:4px}
.ob-prog{margin-bottom:18px}
.ob-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:8px}
.ob-bar{height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden}
.ob-bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.obtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.obtiles button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:96px;border:1px solid var(--border-2);border-radius:12px;background:var(--surface);cursor:pointer;font-weight:600;transition:background .15s,border-color .15s,transform .1s}
.obtiles button:hover{background:var(--surface-2);border-color:var(--accent)}
.obtiles button:active{transform:scale(.98)}
.obtiles button.on{border-color:var(--accent);background:var(--accent-soft)}
.obtiles .i{width:30px;height:30px;color:var(--accent-strong)}
.ob-form{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.ob-form input[type=text],.ob-form input[type=number]{min-height:48px;font-size:16px}
.ob-odo{display:flex;align-items:center;gap:10px}
.ob-odo input{font-size:26px!important;font-weight:650;min-height:58px!important}
.ob-odo span{font-size:18px;color:var(--muted);font-weight:600}
.ob-chk{align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)}
.ob-chk input{margin-top:2px}
.ob-chk small{display:block;color:var(--text-2);font-size:13px;margin-top:2px}
.ob-err{color:var(--bad);font-size:13.5px;font-weight:600}
.ob-err:empty{display:none}
.ob-acts{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.ob-form .ob-acts{margin-top:4px}
.ob-acts .btn{min-height:46px;padding:10px 18px;font-size:15px}
.ob-done{width:64px;height:64px;border-radius:99px;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:4px 0 14px;animation:pop .3s cubic-bezier(.2,.9,.3,1.3) both}
.ob-done .i{width:34px;height:34px;stroke-width:2.6}
.ob-done.sm{width:40px;height:40px;margin:0;flex:none}
.ob-done.sm .i{width:22px;height:22px}
.ob-next{margin-top:16px;padding:14px;border-radius:10px;background:var(--accent-soft);font-size:14px}
.ob-next b{display:block;margin-bottom:2px}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
/* setup checklist + overdue bar */
.cl{margin-bottom:14px}
.cl-bar{margin:12px 16px 4px}
.cl-row{width:100%;border:0;border-top:1px solid var(--border);background:none;text-align:left;min-height:52px;color:inherit}
.cl-row>.i{color:var(--muted)}
.cl-ic{width:22px;height:22px;border-radius:99px;border:2px solid var(--border-2);display:grid;place-items:center;flex:none}
.cl-row.done .cl-ic{background:var(--ok);border-color:var(--ok)}
.cl-row.done .cl-ic .i{width:14px;height:14px;stroke-width:3;color:var(--surface)}
.cl-row.done .t{color:var(--muted);text-decoration:line-through;font-weight:500}
.cl-done,.alertbar{display:flex;gap:12px;align-items:center;padding:12px 16px;margin-bottom:14px}
.alertbar{border-color:var(--bad)}
.cl-done .main,.alertbar .main{flex:1;min-width:0}
.cl-done .t,.alertbar .t{font-weight:650}
.cl-done .m,.alertbar .m{font-size:13px;color:var(--text-2)}
.ic.bad{background:var(--bad-soft);color:var(--bad)}
.hero-acts{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}
/* forms: optional fields tucked away */
.fmore{grid-column:span 2;border-top:1px solid var(--border)}
.fmore>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;min-height:44px;font-weight:600;color:var(--accent-strong)}
.fmore>summary::-webkit-details-marker{display:none}
.fmore>summary .i{width:16px;height:16px;transition:transform .2s}
.fmore[open]>summary .i{transform:rotate(180deg)}
.fmore>.dlg-b{padding:4px 0 0}
.hint.warn{color:var(--warn);font-weight:600}
#toast.act{pointer-events:auto}
#toast button{margin-left:14px;border:0;background:none;color:var(--bg);font-weight:700;text-decoration:underline;cursor:pointer;padding:6px 4px;min-height:36px}

@media (max-width:860px){
  .tiles{grid-template-columns:1fr 1fr}
  .g2,.g3{grid-template-columns:1fr}
}
@media (max-width:640px){
  body{font-size:14.5px}
  .notice{left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));max-width:none}
  .totop{right:18px;bottom:calc(140px + env(safe-area-inset-bottom) + var(--notice-h,0px))}
  .vsel{max-width:none;flex:1}
  .fab{bottom:calc(76px + env(safe-area-inset-bottom) + var(--notice-h,0px));right:16px;padding:14px}
  .fab span{display:none}
  main{padding-bottom:calc(150px + var(--notice-h,0px))}
  .hero .odo{font-size:36px}
  .hero>div:last-child{text-align:left!important}
  .tile .val{font-size:20px}
  .dlg-b{grid-template-columns:1fr}
  .fld.half{grid-column:span 2}
  .tasks{grid-template-columns:1fr}
  .hbar .nm{width:100px}
  .hbar .p{display:none}
  .hide-sm{display:none}
  .btn{min-height:44px}
  .btn.sm{min-height:40px}
  .iconbtn{width:44px;height:44px}
  .chk{padding:8px 0}
  .obtiles{grid-template-columns:1fr 1fr}
  .ob{padding:18px 16px 20px;margin:4px auto}
  .hero-acts{justify-content:flex-start}
  th,td{padding:9px 8px}
  td .m{font-size:12px}
  .search{width:100%}
  .addgrid{grid-template-columns:1fr}
  #toast{bottom:150px}
}

/* =====================================================================
   UTILITY THEME — desktop-software look, slate accent. Loaded last;
   overrides the earlier rounded/animated layer. Geometry: --r for panels,
   --r-sm for controls. Motion: <=120ms, no entrance choreography.
   ===================================================================== */
body{font-family:var(--font);font-size:14px;line-height:1.45}
h1,h2,h3{font-weight:600;letter-spacing:-.005em}
h1{font-size:22px;font-weight:650;letter-spacing:-.015em}
h2{font-size:14.5px}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
.sub{font-size:13.5px}

/* motion: no lifts, no entrance animation, quick colour transitions only */
main.anim>*,main.anim .chart g.col,main.anim .chart path.line,main.anim .chart path.area,
main.anim .meter span,main.anim .hbar .trk span,.faq details[open] .a,.notice,.ob-done{animation:none}
main.anim .chart path.line{stroke-dasharray:none;stroke-dashoffset:0}
.btn,.iconbtn,.fab,.seg button,.addgrid button,.more,.sr,.vsel,.faq summary,.obtiles button,
.row.click,.cl-row,input,select,textarea{transition:background-color var(--ease),border-color var(--ease),color var(--ease),box-shadow var(--ease)}
.btn:active,.iconbtn:active,.fab:active,.obtiles button:active{transform:none}
.faq summary .i,.fmore>summary .i{transition:transform var(--ease)}
.ob-bar span{transition:width .2s ease}
#toast{transition:opacity var(--ease)}
.totop{transform:none;transition:opacity var(--ease),background-color var(--ease),color var(--ease)}

.vsel{min-height:var(--ctl-sm);padding:4px 30px 4px 10px;border-radius:var(--r-sm);border-color:var(--border-2);background-color:var(--surface);font-size:13.5px}
.vsel:hover{border-color:color-mix(in srgb,var(--text) 35%,var(--border-2))}
.iconbtn{width:var(--ctl-sm);height:var(--ctl-sm);border-radius:var(--r-sm);border-color:transparent;background:none}
.iconbtn:hover{background:var(--surface-2);border-color:var(--border)}
.iconbtn .i{width:17px;height:17px}
#progress{height:2px}

/* page structure */
main{padding-top:20px}
.head{margin-bottom:14px}
.grid,.stack,.vcards{gap:12px}
.tiles{gap:12px;margin-bottom:12px}
.mt{margin-top:12px}

/* cards / panels */
.card{border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:12px 16px}
.more{border-radius:0 0 var(--r) var(--r);font-size:13.5px;min-height:40px}
.tile .lbl{font-size:12px;font-weight:600;color:var(--text-2)}
.tile .val{font-size:22px;font-weight:650;letter-spacing:-.01em;margin-top:4px}
.tile .note{font-size:12px}
.hero{border-left:3px solid var(--accent);padding:18px 20px}
.hero .odo{font-size:clamp(34px,6vw,44px);font-weight:650;letter-spacing:-.02em}
.vtitle{font-weight:650}
.vcard[data-act]:hover{border-color:var(--border-2);box-shadow:var(--shadow);background:var(--surface-2)}
.vbadge{width:40px;height:40px;border-radius:var(--r)}
.vbadge .i{width:22px;height:22px}
.ic{width:32px;height:32px;border-radius:var(--r-sm)}
.alertbar{border-left:3px solid var(--bad)}
.cl-done{border-left:3px solid var(--ok)}
.empty{padding:28px 16px;font-size:13.5px}

/* chips, pills, meters: squared */
.chip{border-radius:var(--r-sm);font-size:12px;padding:2px 8px}
.pill{border-radius:var(--r-sm);font-size:11.5px;padding:2px 7px;font-weight:600}
.meter,.ob-bar{height:8px;border-radius:2px;border:0;background:var(--grid)}
.meter span,.ob-bar span{border-radius:2px}
.hbar .trk span{border-radius:0 2px 2px 0}
.legend i,.hbar .nm i{border-radius:2px}
mark{border-radius:2px}

/* buttons */
.btn{border-radius:var(--r-sm);min-height:var(--ctl);padding:0 14px;font-size:13.5px;justify-content:center}
.btn:hover{background:var(--surface-2);border-color:color-mix(in srgb,var(--text) 30%,var(--border-2))}
.btn:active{background:var(--surface-3)}
.btn.sm{min-height:var(--ctl-sm);padding:0 10px;font-size:13px}
.btn.lg{min-height:44px;padding:0 20px;font-size:14.5px}
.btn.pri{font-weight:600}
.btn.pri:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.pri:active{filter:brightness(.94)}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{border-color:transparent}
.btn.danger{border-color:color-mix(in srgb,var(--bad) 45%,var(--border-2))}
.btn:disabled,.btn:disabled:hover{opacity:1;background:var(--surface-2);border-color:var(--border);color:var(--muted);cursor:not-allowed}
.btn.pri:disabled,.btn.pri:disabled:hover{background:color-mix(in srgb,var(--accent) 35%,var(--surface-2));border-color:transparent;color:color-mix(in srgb,var(--on-accent) 80%,transparent)}
button:focus-visible,summary:focus-visible,[data-act]:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.linkbtn{min-height:var(--ctl)}

/* segmented control: joined rectangles, selected = soft accent (keeps the primary button dominant) */
.seg{padding:0;gap:0;border:0;background:none;border-radius:var(--r-sm)}
.seg button{border:1px solid var(--border-2);border-radius:0;margin-left:-1px;min-height:var(--ctl-sm);padding:0 12px;font-size:13px;background:var(--surface);color:var(--text-2)}
.seg button:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm);margin-left:0}
.seg button:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
.seg button:hover:not(.on){background:var(--surface-2);color:var(--text)}
.seg button.on,.seg button.on:hover{position:relative;z-index:1;background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);box-shadow:none;font-weight:600}
.toolbar .seg button{min-height:var(--ctl)}

/* forms */
.fld{gap:4px}
.fld label,.fld .glabel{font-size:12.5px;font-weight:600}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld select,.fld textarea,.search,.cfm-b input{border-radius:var(--r-sm);border-color:var(--border-2);padding:6px 9px;font-size:14px}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld select,.search,.cfm-b input{min-height:var(--ctl)}
.fld input:hover:not(:focus),.fld select:hover:not(:focus),.fld textarea:hover:not(:focus),.search:hover:not(:focus){border-color:color-mix(in srgb,var(--text) 35%,var(--border-2))}
.fld input:focus,.fld select:focus,.fld textarea:focus,.search:focus,.vsel:focus,.cfm-b input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fld.err input,.fld.err select{box-shadow:0 0 0 1px var(--bad)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
.tasks{border-radius:var(--r-sm)}
.chk input{width:16px;height:16px}
.fmore>summary{font-size:13.5px}

/* tables */
table{font-size:13.5px}
th{font-size:12px;padding:7px 12px;border-bottom-color:var(--border-2)}
td{padding:8px 12px}
tbody tr:hover td{background:var(--hover-band)}
.tablewrap{border-top:1px solid var(--border)}
.card-h+.tablewrap{border-top:0}

/* lists */
.row{padding:10px 16px}
.row.click:hover,.cl-row:hover{background:var(--hover-band)}
.cl-ic{border-radius:var(--r-sm);width:20px;height:20px}

/* charts */
.chart{padding:8px 12px 10px}
#tip{border-radius:var(--r-sm);box-shadow:var(--shadow-pop);padding:7px 10px}
#tip .tr i{border-radius:2px}

/* overlays: dialogs, search, add menu, toasts, notice */
dialog{border-radius:8px;box-shadow:var(--shadow-pop);border:1px solid var(--border)}
dialog::backdrop{background:rgba(10,12,16,.45)}
.dlg-h{padding:14px 18px}
.dlg-h h2{font-size:16px}
.dlg-f{padding:12px 18px}
.addgrid{gap:8px}
.addgrid button{border-radius:var(--r);padding:12px}
.addgrid button:hover{border-color:var(--accent)}
.sbox{border-radius:var(--r-sm);background:var(--surface);min-height:var(--ctl)}
.sbox:focus-within{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sr{border-radius:0}
.sr.on{box-shadow:inset 2px 0 0 var(--accent)}
.sgrp,.faq-sec{font-size:11.5px;letter-spacing:.06em}
.cfm-ic{width:36px;height:36px;border-radius:var(--r)}
#toast{border-radius:var(--r);box-shadow:var(--shadow-pop)}
.notice{border-radius:var(--r);box-shadow:var(--shadow-pop);max-width:400px}
.skip{border-radius:var(--r-sm)}

/* floating actions: squared, not pills */
.fab{border-radius:var(--r);padding:0 18px;min-height:46px;box-shadow:var(--shadow-pop);font-weight:600}
.fab:hover{box-shadow:var(--shadow-pop)}
.totop{border-radius:var(--r);width:40px;height:40px;box-shadow:var(--shadow-pop)}

/* onboarding / welcome */
.ob{padding:20px 24px 24px}
.obtiles button{border-radius:var(--r);min-height:92px}
.obtiles button:hover{border-color:var(--accent)}
.obtiles button.on{box-shadow:inset 0 0 0 1px var(--accent)}
.ob-chk,.ob-next{border-radius:var(--r)}
.ob-next{border-left:3px solid var(--accent)}
.ob-form input[type=text],.ob-form input[type=number]{min-height:44px;font-size:16px}
.ob-odo input{min-height:54px!important}
.ob-acts .btn{min-height:44px}
.ob-done{border-radius:var(--r);width:56px;height:56px}
.ob-done.sm{width:36px;height:36px}
.welcome .logo{width:52px;height:52px;border-radius:8px}

/* FAQ */
.faq summary{padding:12px 16px;font-size:14px}

@media (max-width:640px){
  .fab{min-height:52px;width:52px;padding:0;justify-content:center}
  .hero{padding:16px}
  .hero .odo{font-size:34px}
  .tile .val{font-size:20px}
  .card-h{padding:12px 14px}
}
/* touch & small screens: keep 44px targets */
@media (pointer:coarse),(max-width:640px){
  :root{--ctl:44px;--ctl-sm:40px}
  .iconbtn{width:44px;height:44px}
  .vsel{min-height:44px}
  .seg button{min-height:44px}
}
@media print{.fab,.totop,.notice{box-shadow:none}.hero{border-left-width:1px}}

/* shared ecosystem components: logo badge + light/dark switch */
.welcome .logo{width:52px;height:52px;border-radius:var(--r)}
.welcome .logo svg{width:100%;height:100%}
/* shared ecosystem: Data menu + "backed up" chip */
.dwrap{position:relative}
.dbtn[aria-expanded="true"]{background:var(--surface-2);border-color:var(--accent)}

/* ---- install card ---- */
.mb-install{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-left:3px solid var(--accent);

.mb-install>div{flex:1;min-width:0}

.mb-install p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
.mb-install p b{display:inline;font-size:inherit}
.mb-install .btn{flex:none}
.mb-install.is-done{border-left-color:var(--good)}
.mb-install.is-done>.uic{color:var(--good-ink)}

.mb-about{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;margin-top:12px;border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:var(--r);background:var(--surface)}

.mb-about>div{flex:1;min-width:0}
.mb-about b{display:block;font-size:14px;font-weight:600;color:var(--ink)}
.mb-about p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}

.mb-about .mb-about-links a,.mb-about .mb-about-links button{display:inline-flex;align-items:center;min-height:28px;padding:0;border:0;background:none;
  font:inherit;color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.mb-about .mb-about-links a:hover,.mb-about .mb-about-links button:hover{color:var(--accent-hover)}
.mb-about .mb-about-copy{margin-top:4px;color:var(--muted,var(--ink-2))}

.mb-share-btn .uic{width:16px;height:16px}

dialog.mb-share{width:min(460px,calc(100vw - 24px));max-height:calc(100dvh - 24px);padding:0;border:1px solid var(--border);border-radius:var(--r-lg);

  const idmap={};const fix=id=>{id=String(id??'');if(SAFEID.test(id))return id;if(!idmap[id])idmap[id]=uid();return idmap[id]};

      for(const f of Object.keys(r)){if(f==='__proto__'||f==='constructor'||f==='prototype')continue;const v=r[f];

/* Recently deleted: everything you delete is kept on this device for 30 days so it can be restored. */

  if(k==='issues')return'Problem: '+(x.code?x.code+' ':'')+(x.title||'')+on;if(k==='docs')return'Document: '+(x.title||x.dkind||'');

  const before={};for(const k of COLLS)before[k]=S[k].slice();fn();
  const d={};for(const k of COLLS){const now=new Set(S[k].map(x=>x.id));const gone=before[k].filter(x=>!now.has(x.id));if(gone.length)d[k]=clone(gone)}

  const i=TRASH.findIndex(x=>x.id===id);if(i<0){toast('That item is no longer available');return}

  const vids=new Set([...S.vehicles.map(v=>v.id),...(t.data.vehicles||[]).map(v=>v.id)]);

/* Save location: File System Access API. The chosen file handle is kept in IndexedDB (handles can't go in localStorage),

const FS_OK=typeof window.showSaveFilePicker==='function'&&typeof window.showOpenFilePicker==='function';

const FKIND={json:{name:'mbauto-backup.json',mime:'application/json',types:[{description:'mbauto.online backup',accept:{'application/json':['.json']}}]},

/* One IndexedDB database: store 'h' = chosen backup file handles, store 'f' = attached receipts, photos and PDFs. */

  r.onsuccess=()=>{const db=r.result;let q;try{const tx=db.transaction(store,mode);q=fn(tx.objectStore(store));tx.oncomplete=()=>{db.close();res(q&&q.result)};tx.onerror=tx.onabort=()=>{db.close();rej(tx.error)}}catch(e){db.close();rej(e)}}})}

function readings(vid){
  const v=veh(vid);const r=[];
  if(v&&n0(v.startOdo)!=null)r.push({date:v.purchaseDate||'',odo:+v.startOdo});
  for(const c of[S.services,S.fuel,S.odo])for(const x of c)if(x.vid===vid&&n0(x.odo)!=null)r.push({date:x.date,odo:+x.odo,id:x.id});

function currentOdo(vid){let m=null;for(const r of readings(vid))if(m==null||r.odo>m)m=r.odo;return m}
function milesPerDay(vid){
  const r=readings(vid).filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date)||a.odo-b.odo);
  if(r.length>=2){const a=r[0],b=r[r.length-1];const d=daysBetween(a.date,b.date);if(d>=14&&b.odo>a.odo)return(b.odo-a.odo)/d}
  const v=veh(vid);return v&&v.type==='Motorcycle'?10:33;
}
function realRate(vid){const r=readings(vid).filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date));return r.length>=2&&daysBetween(r[0].date,r[r.length-1].date)>=14}
function milesInRange(vid,from,to){
  const r=readings(vid).filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date)||a.odo-b.odo);
  const before=r.filter(x=>x.date<from),inr=r.filter(x=>x.date>=from&&x.date<=to);
  if(!inr.length)return 0;
  const start=before.length?Math.max(...before.map(x=>x.odo)):Math.min(...inr.map(x=>x.odo));
  return Math.max(0,Math.max(...inr.map(x=>x.odo))-start);
}
const fuelTotal=x=>n0(x.total)!=null?+x.total:(+x.gal||0)*(+x.ppg||0);

function mpgSeries(vid){
  const f=S.fuel.filter(x=>x.vid===vid&&n0(x.odo)!=null).sort((a,b)=>a.odo-b.odo||a.date.localeCompare(b.date));
  const out=[];let last=null,gal=0;
  for(const x of f){
    if(x.missed){last=null;gal=0}
    if(!last){if(x.full){last=x;gal=0}continue}
    gal+=+x.gal||0;
    if(x.full){const m=x.odo-last.odo;if(m>0&&gal>0)out.push({date:x.date,odo:x.odo,mpg:m/gal,miles:m,gal,id:x.id});last=x;gal=0}
  }
  return out;
}

/* reminders */
function remStatus(r){
  const cur=currentOdo(r.vid);
  let lastDate=r.lastDate||'',lastOdo=n0(r.lastOdo);
  for(const s of S.services)if(s.vid===r.vid&&(s.tasks||[]).includes(r.id)&&(!lastDate||s.date>=lastDate)){lastDate=s.date;if(n0(s.odo)!=null)lastOdo=+s.odo}
  const miles=n0(r.miles),months=n0(r.months);
  const dueOdo=miles&&lastOdo!=null?lastOdo+miles:null;
  const dueDate=months&&lastDate?addMonths(lastDate,months):null;
  if(dueOdo==null&&dueDate==null)return{state:'unk',lastDate,lastOdo,label:'Not logged yet',pct:0};
  const t=today(),mpd=milesPerDay(r.vid);
  const milesLeft=dueOdo!=null&&cur!=null?dueOdo-cur:null;
  const daysLeft=dueDate?daysBetween(t,dueDate):null;
  const cands=[];if(daysLeft!=null)cands.push(daysLeft);if(milesLeft!=null)cands.push(milesLeft/mpd);
  const eff=Math.min(...cands);
  let pct=0;
  if(milesLeft!=null&&miles)pct=Math.max(pct,1-milesLeft/miles);
  if(daysLeft!=null&&lastDate){const tot=daysBetween(lastDate,dueDate)||1;pct=Math.max(pct,1-daysLeft/tot)}
  const over=(milesLeft!=null&&milesLeft<=0)||(daysLeft!=null&&daysLeft<=0);
  const soon=!over&&((milesLeft!=null&&milesLeft<=Math.max(300,miles*0.1))||(daysLeft!=null&&daysLeft<=30)||eff<=30);
  const parts=[];
  if(over){
    if(milesLeft!=null&&milesLeft<=0)parts.push(`${mi(-milesLeft)} mi overdue`);
    if(daysLeft!=null&&daysLeft<=0)parts.push(daysLeft===0?'due today':`${plural(-daysLeft,'day')} overdue`);
  }else{
    if(milesLeft!=null)parts.push(`in ${mi(milesLeft)} mi`);
    if(dueDate)parts.push(`by ${fd(dueDate)}`);
  }
  return{state:over?'over':soon?'soon':'ok',lastDate,lastOdo,dueOdo,dueDate,milesLeft,daysLeft,eff,pct:Math.min(1,Math.max(0,pct)),label:parts.join(' · '),estDate:milesLeft!=null&&milesLeft>0?addDays(t,milesLeft/mpd):null};
}
const stateRank={over:0,soon:1,ok:2,unk:3};
const pill=st=>({over:`<span class="pill over">${ic('alert')}Overdue</span>`,soon:`<span class="pill soon">${ic('clock')}Due soon</span>`,ok:`<span class="pill ok">${ic('check')}Not due</span>`,unk:`<span class="pill unk">${ic('q')}No history</span>`})[st];
function sortedReminders(vids){
  return S.reminders.filter(r=>vids.includes(r.vid)).map(r=>({r,s:remStatus(r)}))
    .sort((a,b)=>stateRank[a.s.state]-stateRank[b.s.state]||(a.s.eff??1e9)-(b.s.eff??1e9)||a.r.task.localeCompare(b.r.task));
}

function addDefaultSchedule(v){
  const list=v.type==='Motorcycle'?SCHED.Motorcycle:isEV(v)?SCHED.Electric:SCHED.vehicle;
  const have=new Set(S.reminders.filter(r=>r.vid===v.id).map(r=>r.task.toLowerCase()));
  let n=0;for(const[t,m,mo]of list){if(have.has(t.toLowerCase()))continue;S.reminders.push({id:uid(),vid:v.id,task:t,miles:m,months:mo,lastDate:'',lastOdo:'',notes:''});n++}

/* costs */
const GROUPS=['Fuel','Maintenance','Repairs','Insurance & fees','Loan / lease','Other'];
const GCOL={'Fuel':'var(--s1)','Maintenance':'var(--s2)','Repairs':'var(--s3)','Insurance & fees':'var(--s4)','Loan / lease':'var(--s5)','Other':'var(--s6)'};
const EXP_CATS={'Insurance':'Insurance & fees','Registration & taxes':'Insurance & fees','Inspection':'Insurance & fees','Loan / lease payment':'Loan / lease','Parking & tolls':'Other','Wash & detailing':'Other','Accessories & upgrades':'Other','Towing & roadside':'Other','Other':'Other'};
const REPEATS={none:'Doesn’t repeat',monthly:'Every month',quarterly:'Every 3 months',semiannual:'Every 6 months',yearly:'Every year'};
const REPSTEP={monthly:1,quarterly:3,semiannual:6,yearly:12};
function occurrences(e,to){
  if(!e.repeat||e.repeat==='none')return e.date<=to?[e.date]:[];
  const end=e.until&&e.until<to?e.until:to;const out=[];
  for(let i=0;i<1200;i++){const d=addMonths(e.date,REPSTEP[e.repeat]*i);if(d>end)break;out.push(d)}
  return out;
}
function costEntries(vids,from,to){
  const out=[];
  for(const x of S.fuel)if(vids.includes(x.vid)&&x.date>=from&&x.date<=to)out.push({date:x.date,vid:x.vid,g:'Fuel',amt:fuelTotal(x)});
  for(const s of S.services)if(vids.includes(s.vid)&&!s.prevOwner&&s.date>=from&&s.date<=to){
    if(s.kind==='repair'){if(!s.covered)out.push({date:s.date,vid:s.vid,g:'Repairs',amt:+s.cost||0})}
    else out.push({date:s.date,vid:s.vid,g:'Maintenance',amt:+s.cost||0});
  }
  for(const e of S.expenses)if(vids.includes(e.vid))for(const d of occurrences(e,to))if(d>=from)out.push({date:d,vid:e.vid,g:EXP_CATS[e.category]||'Other',amt:+e.amount||0,cat:e.category});
  return out;
}
function rangeBounds(k){
  const t=today();
  if(k==='year')return{from:t.slice(0,4)+'-01-01',to:t,label:'This year'};
  if(k==='12m')return{from:addDays(addMonths(t,-12),1),to:t,label:'Last 12 months'};
  let min=t;for(const c of[S.fuel,S.services,S.expenses])for(const x of c)if(scopeIds().includes(x.vid)&&x.date&&x.date<min)min=x.date;
  for(const v of scope())if(v.purchaseDate&&v.purchaseDate<min)min=v.purchaseDate;
  return{from:min,to:t,label:'All time'};
}

/* ---- Repairs (repairs, problems log, repeat repairs, quotes) ---- */
const SRC_PILL={me:'<span class="pill unk">Your observation</span>',reader:'<span class="pill soon">Code reader · not confirmed</span>',mechanic:'<span class="pill neutral">Mechanic confirmed</span>'};
function issueBack(x){const k=(x.code||'').trim().toUpperCase(),t=(x.title||'').trim().toLowerCase();
  return S.issues.some(o=>o.id!==x.id&&o.vid===x.vid&&o.date<x.date&&(k?(o.code||'').trim().toUpperCase()===k:(o.title||'').trim().toLowerCase()===t&&t))}
function issueRow(x){const rep=x.repairId&&S.services.find(s=>s.id===x.repairId);
  return`<div class="row click tl-row" data-act="editIssue" data-id="${esc(x.id)}"><div class="ic ${x.status==='resolved'?'ok':'warn'}">${ic('flag')}</div>
  <div class="main"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="t">${x.code?esc(x.code.toUpperCase())+' · ':''}${esc(x.title||x.itype)}</span>${x.status==='resolved'?`<span class="pill ok">${ic('check')}Fixed</span>`:`<span class="pill over">${ic('alert')}Open</span>`}${SRC_PILL[x.source]||''}${issueBack(x)?'<span class="pill soon">Came back</span>':''}</div>
  <div class="m">${esc(x.itype)} · ${fd(x.date)}${n0(x.odo)!=null?' · '+mi(+x.odo)+' mi':''}${vtag(x.vid)}${clip(x.files)}</div>
  ${rep?`<div class="m">Fixed by: ${esc(rep.title||'Repair')}, ${fd(rep.date)}</div>`:x.status==='resolved'&&x.resolvedDate?`<div class="m">Resolved ${fd(x.resolvedDate)}</div>`:''}</div></div>`}
const COMPONENTS=[['Brakes',/brake|pads?\b|rotor|caliper/i],['Battery & charging',/battery|alternator|starter|charging/i],['Tires & wheels',/tire|tyre|wheel|alignment|flat\b/i],['A/C & heat',/\ba\/?c\b|air ?cond|compressor|heater|blower/i],
  ['Suspension & steering',/suspension|strut|shock|ball joint|tie rod|control arm|steering|bushing/i],['Exhaust & emissions',/exhaust|muffler|catalytic|o2 sensor|oxygen sensor|\begr\b/i],['Cooling',/radiator|coolant|water pump|thermostat|hose/i],
  ['Transmission & drivetrain',/transmission|clutch|\baxle|\bcv\b|differential|drive ?shaft/i],['Engine',/engine|gasket|timing|spark|ignition coil|injector|misfire/i],['Electrical & lights',/electric|fuse|wiring|headlight|bulb|switch/i]];
function repeatRepairs(ids){const out=[];
  for(const[name,re]of COMPONENTS){const r=S.services.filter(s=>ids.includes(s.vid)&&s.kind==='repair'&&re.test((s.title||'')+' '+(s.symptom||''))).sort((a,b)=>a.date.localeCompare(b.date));
    const byV={};for(const x of r)(byV[x.vid]=byV[x.vid]||[]).push(x);
    for(const[vid,l]of Object.entries(byV))if(l.length>=2){const a=l[l.length-2],b=l[l.length-1];
      out.push({name,vid,n:l.length,cost:l.reduce((t,x)=>t+(x.covered?0:+x.cost||0),0),gap:n0(a.odo)!=null&&n0(b.odo)!=null?+b.odo- +a.odo:null,days:daysBetween(a.date,b.date),last:b})}}
  return out}
const qTotal=q=>['parts','labor','diag','fees'].reduce((a,k)=>a+(+q[k]||0),0);
function quoteFlags(q){const f=[];if(n0(q.parts)==null)f.push('no parts price');if(n0(q.labor)==null)f.push('no labor price');if(!q.warranty)f.push('no warranty listed');return f}
function quotesHTML(ids){
  const qs=S.quotes.filter(q=>ids.includes(q.vid));const jobs={};for(const q of qs){const k=q.vid+'|'+(q.job||'').trim().toLowerCase();(jobs[k]=jobs[k]||[]).push(q)}
  const newest=g=>g.map(x=>x.date).sort().pop()||'';const list=Object.values(jobs).sort((a,b)=>newest(b).localeCompare(newest(a)));
  return`<div class="card mt"><div class="card-h"><div><h2>Repair quotes</h2><div class="sub">Compare estimates for the same job side by side</div></div><button class="btn sm" data-act="add" data-k="quote">${ic('plus')}Add quote</button></div>
  ${list.length?list.map(g=>{g.sort((a,b)=>qTotal(a)-qTotal(b));const lo=qTotal(g[0]);const acc=g.some(q=>q.accepted);
    return`<div class="card-h" style="border-top:1px solid var(--border)"><div><b>${esc(g[0].job||'Repair')}</b>${vtag(g[0].vid)?`<span class="m"> · ${esc(vname(veh(g[0].vid)))}</span>`:''}<div class="sub">${plural(g.length,'quote')}${acc?' · one accepted':''}</div></div></div>
    <div class="tablewrap"><table class="qtable"><thead><tr><th>Shop</th><th class="r">Parts</th><th class="r">Labor</th><th class="r hide-sm">Diagnosis</th><th class="r hide-sm">Fees & tax</th><th class="r">Total</th><th class="hide-sm">Warranty</th><th></th></tr></thead><tbody>
    ${g.map(q=>{const fl=quoteFlags(q);return`<tr><td>${esc(q.shop||'Shop')}${q.accepted?' <span class="pill ok">Accepted</span>':''}${g.length>1&&qTotal(q)===lo?' <span class="pill neutral">Lowest total</span>':''}<div class="m">${fd(q.date)}${n0(q.hours)!=null?' · '+(+q.hours)+' labor hr':''}${clip(q.files)}</div>${fl.length?`<div class="qflag">${esc(fl.join(', '))}</div>`:''}</td>
      <td class="r num">${n0(q.parts)!=null?money(+q.parts):'—'}</td><td class="r num">${n0(q.labor)!=null?money(+q.labor):'—'}</td><td class="r num hide-sm">${n0(q.diag)!=null?money(+q.diag):'—'}</td><td class="r num hide-sm">${n0(q.fees)!=null?money(+q.fees):'—'}</td>
      <td class="r num"><b>${money(qTotal(q))}</b></td><td class="hide-sm">${esc(q.warranty||'—')}</td>
      <td class="r" style="white-space:nowrap"><button class="btn sm ghost" data-act="editQuote" data-id="${esc(q.id)}" aria-label="Edit quote">${ic('edit')}</button>${q.accepted?'':`<button class="btn sm" data-act="acceptQuote" data-id="${esc(q.id)}">Use this one</button>`}</td></tr>`}).join('')}
    </tbody></table></div>`}).join(''):`<div class="empty"><b>No quotes yet</b>Got estimates from two shops? Add both under the same job name to compare parts, labor, fees and warranty.</div>`}
  <details class="faq" style="border-top:1px solid var(--border)"><summary>Terms you’ll see on estimates${ic('chev')}</summary><div class="a"><ul>
    <li><b>Book hours:</b> the standard time a guide lists for the job. Shops usually bill this, not the actual time spent.</li>
    <li><b>Diagnostic fee:</b> charged to find the problem. Some shops waive or credit it if you approve the repair.</li>
    <li><b>Shop supplies:</b> a small charge for rags, cleaners and the like, often a percentage of labor.</li>
    <li><b>OEM vs. aftermarket parts:</b> OEM parts come from the vehicle maker; aftermarket parts come from other makers. Price, fit and warranty can differ.</li>
    <li><b>Parts and labor warranty:</b> how long the shop stands behind the work, for example 12 months / 12,000 miles.</li></ul>
    <p>A lower total isn’t always the better deal. Compare which parts are used and what each warranty covers.</p></div></details></div>`;
}

/* ---- Costs ---- */
function vCosts(){
  const vs=scope(),ids=vs.map(v=>v.id);const rk=S.settings.range||'year';const R=rangeBounds(rk);
  const e=costEntries(ids,R.from,R.to);
  const tot=e.reduce((a,b)=>a+b.amt,0);
  const byG={};for(const g of GROUPS)byG[g]=0;for(const x of e)byG[x.g]+=x.amt;
  const miles=ids.reduce((a,id)=>a+milesInRange(id,R.from,R.to),0);
  const months=Math.max(1,(daysBetween(R.from,R.to)+1)/30.44);
  const maxG=Math.max(...Object.values(byG),1);
  const dep=vs.filter(v=>n0(v.purchasePrice)!=null&&n0(v.currentValue)!=null);
  const depAmt=dep.reduce((a,v)=>a+(+v.purchasePrice- +v.currentValue),0);
  /* Loan payments repay the purchase price. When depreciation is counted for a vehicle, its loan payments are left out of
     the ownership figure so the same dollars aren't counted twice. (Loan interest is therefore not in that figure.) */
  const depIds=new Set(dep.map(v=>v.id));
  const loanDup=e.filter(x=>x.g==='Loan / lease'&&depIds.has(x.vid)).reduce((a,b)=>a+b.amt,0);
  const own=tot-loanDup+depAmt;
  const exps=S.expenses.filter(x=>ids.includes(x.vid)).sort((a,b)=>b.date.localeCompare(a.date));
  const runRate=exps.filter(x=>x.repeat&&x.repeat!=='none'&&(!x.until||x.until>=today())).reduce((a,x)=>a+(+x.amount||0)/REPSTEP[x.repeat],0);
  const perVeh=vs.length>1?vs.map(v=>{const ee=e.filter(x=>x.vid===v.id);const t=ee.reduce((a,b)=>a+b.amt,0);const m=milesInRange(v.id,R.from,R.to);return{v,t,m}}):[];
  const pm=v=>miles?money(v/miles,2):'—';
  const fixed=byG['Insurance & fees']+byG['Loan / lease']+byG['Other'];
  return`<div class="head"><div><h1>Cost of ownership</h1><div class="sub">${esc(scopeLabel())} · ${fd(R.from)} – ${fd(R.to)}</div></div>
    <div class="toolbar"><div class="seg">${[['year','This year'],['12m','12 months'],['all','All time']].map(([k,l])=>`<button class="${rk===k?'on':''}" aria-pressed="${rk===k}" data-act="range" data-v="${k}">${l}</button>`).join('')}</div><button class="btn pri" data-act="add" data-k="expense">${ic('plus')}Add expense</button></div></div>
  <div class="tiles">
    <div class="card tile"><div class="lbl">Cash paid</div><div class="val num">${money(tot,0)}</div><div class="note">${R.label.toLowerCase()}</div></div>
    <div class="card tile"><div class="lbl">Cost per mile</div><div class="val num">${pm(tot)}</div><div class="note">${miles?mi(miles)+' mi driven':'No mileage in range'}</div></div>
    <div class="card tile"><div class="lbl">Per month</div><div class="val num">${money(tot/months,0)}</div><div class="note">average over range</div></div>
    <div class="card tile"><div class="lbl">Fixed monthly</div><div class="val num">${money(runRate,0)}</div><div class="note">recurring bills, per month</div></div></div>
  <div class="card" style="margin-bottom:12px"><div class="card-h"><div><h2>Per mile</h2><div class="sub">Cash paid in this range ÷ ${miles?mi(miles)+' miles driven':'miles driven'}</div></div></div>
    <div class="dl2"><div><span>Fuel</span><b class="num">${pm(byG.Fuel)}</b></div><div><span>Maintenance</span><b class="num">${pm(byG.Maintenance)}</b></div><div><span>Repairs</span><b class="num">${pm(byG.Repairs)}</b></div><div><span>Insurance, loan & other</span><b class="num">${pm(fixed)}</b></div></div></div>
  <div class="grid g2">
    <div class="card"><div class="card-h"><div><h2>Monthly spending</h2><div class="sub">by category</div></div></div>
      <div class="legend">${GROUPS.filter(g=>byG[g]>0).map(g=>`<span><i style="background:${GCOL[g]}"></i>${g}</span>`).join('')}</div>
      <div class="chart" data-chart="monthly"></div></div>
    <div class="card"><div class="card-h"><div><h2>Where the money goes</h2><div class="sub">${money(tot,0)} cash paid</div></div></div>
      <div style="padding:8px 0">${GROUPS.map(g=>`<div class="hbar"><div class="nm"><i style="background:${GCOL[g]}"></i>${g}</div><div class="trk"><span style="width:${byG[g]/maxG*100}%;background:${GCOL[g]}"></span></div><div class="v num">${money(byG[g],0)}</div><div class="p num">${tot?Math.round(byG[g]/tot*100)+'%':''}</div></div>`).join('')}</div>
      ${dep.length&&rk==='all'?`<div style="border-top:1px solid var(--border);padding:12px 16px;font-size:13.5px">
        <div style="display:flex;justify-content:space-between"><span>Cash paid</span><b class="num">${money(tot,0)}</b></div>
        ${loanDup?`<div style="display:flex;justify-content:space-between;margin-top:4px"><span>Minus loan payments</span><b class="num">−${money(loanDup,0)}</b></div>`:''}
        <div style="display:flex;justify-content:space-between;margin-top:4px"><span>Plus depreciation (est.)</span><b class="num">${money(depAmt,0)}</b></div>
        <div style="display:flex;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)"><span><b>Ownership cost</b></span><b class="num">${money(own,0)}</b></div>
        ${miles?`<div style="display:flex;justify-content:space-between;margin-top:4px"><span>Per mile</span><b class="num">${money(own/miles,2)}</b></div>`:''}
        <div class="m muted" style="margin-top:6px;font-size:12px">Depreciation is purchase price minus your estimated current value; it isn’t cash out of pocket. ${loanDup?'Loan payments are left out here because they pay off the same purchase price, so counting both would double it. Loan interest is left out too. ':''}Update the value in Garage.</div></div>`:''}
    </div></div>
  ${perVeh.length?`<div class="card mt"><div class="card-h"><h2>By vehicle</h2></div><div class="tablewrap"><table><thead><tr><th>Vehicle</th><th class="r">Spent</th><th class="r">Miles</th><th class="r">Per mile</th></tr></thead><tbody>${perVeh.map(p=>`<tr data-act="pick" data-id="${esc(p.v.id)}"><td>${esc(vname(p.v))}</td><td class="r num">${money(p.t,0)}</td><td class="r num">${mi(p.m)}</td><td class="r num">${p.m?money(p.t/p.m,2):'—'}</td></tr>`).join('')}</tbody></table></div></div>`:''}
  <div class="card pad mt" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h2>Keep, repair or replace?</h2><div class="sub">Compare a big repair against replacing the vehicle over the next few years.</div></div><button class="btn" data-act="keepCalc">${ic('scale')}Open calculator</button></div>
  <div class="card mt"><div class="card-h"><div><h2>Other expenses</h2><div class="sub">Insurance, registration, loan payments, tolls…</div></div></div>
  ${exps.length?`<div class="tablewrap"><table><thead><tr><th>Category</th><th>Starts</th><th class="hide-sm">Repeats</th><th class="r">Amount</th></tr></thead><tbody>${exps.map(x=>`<tr data-act="edit" data-k="expense" data-id="${esc(x.id)}"><td>${esc(x.category)}${clip(x.files)}${x.notes||vtag(x.vid)?`<div class="m">${esc([x.notes,vtag(x.vid)?vname(veh(x.vid)):''].filter(Boolean).join(' · '))}</div>`:''}</td><td class="num" style="white-space:nowrap">${fd(x.date)}</td><td class="hide-sm">${x.repeat&&x.repeat!=='none'?REPEATS[x.repeat]+(x.until?`<div class="m">until ${fd(x.until)}</div>`:''):'<span class="m">One-time</span>'}</td><td class="r num">${money(+x.amount||0)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>No other expenses</b>Add insurance, registration or a loan payment once. Set it to repeat and mbauto.online counts every payment.</div>`}</div>
  <p class="fine">Figures are estimates based on what you log. They aren’t tax or financial advice. Services and repairs marked “before I owned it” aren’t counted. <button class="linkbtn" style="padding:0;margin:0;min-height:0;font-size:inherit" data-act="view" data-v="terms">Terms</button></p>`;
}

/* ---- History (timeline + report) ---- */
const HFILT=[['all','All'],['service','Service'],['repair','Repairs'],['issue','Problems'],['check','Checklists'],['fuel','Fuel'],['expense','Expenses'],['odo','Odometer']];
function timeline(ids){
  const a=[];const V=r=>ids.includes(r.vid);
  for(const s of S.services)if(V(s)){const rep=s.kind==='repair';a.push({k:rep?'repair':'service',date:s.date,odo:s.odo,id:s.id,act:'edit',icon:rep?'repair':'wrench',files:s.files,
    t:rep?(s.title||'Repair'):(workText(s)||'Service'),m:[s.shop||(s.diy?'DIY':''),s.prevOwner?'Previous owner':'',rep&&s.covered?'Covered':''].filter(Boolean).join(' · '),amt:rep&&s.covered?null:+s.cost||0,vid:s.vid})}
  for(const f of S.fuel)if(V(f))a.push({k:'fuel',date:f.date,odo:f.odo,id:f.id,act:'edit',icon:'fuel',files:f.files,t:'Fill-up',m:`${(+f.gal||0).toFixed(2)} ${volU(veh(f.vid))}${f.station?' · '+f.station:''}`,amt:fuelTotal(f),vid:f.vid});
  for(const e of S.expenses)if(V(e))a.push({k:'expense',date:e.date,id:e.id,act:'edit',icon:'receipt',files:e.files,t:e.category,m:[e.repeat&&e.repeat!=='none'?REPEATS[e.repeat]:'',e.notes].filter(Boolean).join(' · '),amt:+e.amount||0,vid:e.vid});
  for(const i of S.issues)if(V(i))a.push({k:'issue',date:i.date,odo:i.odo,id:i.id,act:'editIssue',icon:'flag',files:i.files,t:(i.code?i.code.toUpperCase()+' · ':'')+(i.title||i.itype),m:[i.itype,i.status==='resolved'?'Fixed':'Open'].join(' · '),amt:null,vid:i.vid,cls:i.status==='resolved'?'ok':'warn'});
  for(const c of S.checks)if(V(c))a.push({k:'check',date:c.date,odo:c.odo,id:c.id,act:'editCheck',icon:'list',files:c.files,t:c.template||'Checklist',m:`${c.passed.length} OK${c.failed.length?` · ${c.failed.length} need attention`:''}`,amt:null,vid:c.vid,cls:c.failed.length?'warn':'ok'});
  for(const o of S.odo)if(V(o))a.push({k:'odo',date:o.date,odo:o.odo,id:o.id,act:'editOdo',icon:'gauge',t:'Odometer reading',m:'',amt:null,vid:o.vid});
  return a.sort((x,y)=>y.date.localeCompare(x.date)||(+y.odo||0)-(+x.odo||0));
}
function vHistory(){
  const ids=scopeIds();const f=S.settings.hist||'all';const all=timeline(ids);const list=f==='all'?all:all.filter(x=>x.k===f);
  const first=all.length?all[all.length-1].date:null;
  const tracked=ids.reduce((a,id)=>a+milesInRange(id,'0000-01-01',today()),0);
  const nfiles=VCOLLS.reduce((a,k)=>a+S[k].filter(r=>ids.includes(r.vid)).reduce((b,r)=>b+(r.files||[]).length,0),0);
  let html='',yr='';
  for(const x of list.slice(0,LIM.hist)){const y=x.date.slice(0,4);if(y!==yr){yr=y;html+=`<div class="yr">${y}</div>`}
    html+=`<div class="row tl-row${x.act?' click':''}"${x.act?` data-act="${x.act}" data-k="${x.k}" data-id="${esc(x.id)}"`:''}><div class="ic${x.cls?' '+x.cls:''}">${ic(x.icon)}</div>

      ${x.amt!=null?`<div class="amt num">${money(x.amt)}</div>`:''}</div>`}
  return`<div class="head"><div><h1>History</h1><div class="sub">${esc(scopeLabel())} · every record, newest first</div></div><button class="btn pri" data-act="report">${ic('print')}Vehicle history report</button></div>
  <div class="card" style="margin-bottom:12px"><div class="dl2"><div><span>Records</span><b class="num">${all.length.toLocaleString()}</b></div><div><span>First record</span><b>${first?fd(first):'—'}</b></div><div><span>Miles tracked</span><b class="num">${mi(tracked)}</b></div><div><span>Attachments</span><b class="num">${nfiles}</b></div></div></div>

  <p class="fine">The report is built from what you enter and isn’t verified by anyone else. Choose what to include before you share it.</p>`;

/* ================= maintenance forecast ================= */
/* Cost per reminder: the typical cost the owner set, else the average of the last 3 services that ticked it
   (a multi-task service's cost is split evenly across its tasks). No made-up prices. */
function remCost(r){if(n0(r.estCost)!=null)return{c:+r.estCost,src:'set'};
  const h=S.services.filter(s=>(s.tasks||[]).includes(r.id)&&!s.prevOwner&&n0(s.cost)!=null).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
  if(!h.length)return null;return{c:h.reduce((a,s)=>a+(+s.cost)/Math.max(1,(s.tasks||[]).length+(s.other?1:0)),0)/h.length,src:'past',n:h.length}}
function forecast(vids,days){
  const t=today(),end=addDays(t,days),items=[];let unk=0;
  for(const r of S.reminders.filter(r=>vids.includes(r.vid))){const s=remStatus(r);if(s.state==='unk'){unk++;continue}
    const mpd=milesPerDay(r.vid);const step=Math.min(n0(r.months)?+r.months*30.44:Infinity,n0(r.miles)?+r.miles/mpd:Infinity);
    if(!isFinite(step)||step<1)continue;const cost=remCost(r);
    for(let d=s.state==='over'?0:Math.max(0,s.eff),i=0;d<=days&&i<24;d+=step,i++)items.push({r,date:addDays(t,d),cost,over:i===0&&s.state==='over'})}
  items.sort((a,b)=>a.date.localeCompare(b.date));
  const bills=[];for(const e of S.expenses)if(vids.includes(e.vid)&&e.repeat&&e.repeat!=='none')for(const d of occurrences(e,end))if(d>t)bills.push({e,date:d});
  const maint=items.reduce((a,x)=>a+(x.cost?x.cost.c:0),0),bill=bills.reduce((a,x)=>a+(+x.e.amount||0),0);
  return{items,bills,maint,bill,missing:items.filter(x=>!x.cost).length,unk};
}

function keepDefaults(vid){
  const t=today(),from=addDays(addMonths(t,-12),1);const e=costEntries([vid],from,t);const sum=g=>Math.round(e.filter(x=>g.includes(x.g)).reduce((a,b)=>a+b.amt,0));
  const v=veh(vid),val=n0(v.currentValue);
  return{km:sum(['Maintenance','Repairs']),kf:sum(['Fuel']),ki:sum(['Insurance & fees']),kv:val??'',rf:sum(['Fuel']),ri:sum(['Insurance & fees'])};
}
const KC=[['h','Years to compare',1,'years'],
  ['_k','If you keep and repair it'],['repair','Repair cost now'],['km','Maintenance & repairs per year'],['kf','Fuel per year'],['ki','Insurance & fees per year'],['kend','Its value at the end'],
  ['_r','If you replace it'],['price','Replacement price'],['sale','What you’d get for this one now, unrepaired'],['fin','Loan interest over the period'],['rm','Maintenance & repairs per year'],['rf','Fuel per year'],['ri','Insurance & fees per year'],['rend','Replacement’s value at the end']];

  const v0=single()||S.vehicles[0];if(!v0)return;

  ${KC.map(([k,l])=>k[0]==='_'?`<h2 style="grid-column:span 2;margin-top:6px">${l}</h2>`:`<div class="fld half"><label for="kc_${k}">${l}</label><input id="kc_${k}" data-c="${k}" type="number" min="0" step="any" inputmode="decimal"></div>`).join('')}
  <p class="calc-note">Per-year amounts start from your last 12 months for this vehicle. The sale price starts at your estimated value; a buyer will likely pay less while it needs the repair. Change anything that won’t hold.</p>
  <div class="calc-out" id="kc_out" aria-live="polite"></div>

  <div class="dlg-f" style="align-items:center"><div id="kc_sum" class="num" style="margin-right:auto;font-size:13.5px" aria-hidden="true"></div><button type="button" class="btn" data-close>Close</button></div></form>`;
  const F=dlg.querySelector('form'),g=k=>+(F.querySelector(`[data-c=${k}]`).value)||0,setv=(k,v)=>F.querySelector(`[data-c=${k}]`).value=v;
  const fill=vid=>{const d=keepDefaults(vid);setv('h',3);for(const k of['km','kf','ki','rf','ri'])setv(k,d[k]||'');setv('kend',d.kv!==''?Math.round(d.kv*.85**3):'');setv('sale',d.kv)};
  const calc=()=>{const H=Math.max(1,Math.min(15,g('h')||1));
    const keepRest=H*(g('km')+g('kf')+g('ki'))-g('kend'),keep=g('repair')+keepRest;
    const repl=g('price')-g('sale')+g('fin')+H*(g('rm')+g('rf')+g('ri'))-g('rend');

    F.querySelector('#kc_out').innerHTML=`<div class="tile"><div class="lbl">Keep and repair</div><div class="val num">${money(keep,0)}</div><div class="note">${money(keep/H,0)} per year over ${plural(H,'year')}</div></div>

      ${g('price')?`<p class="calc-note"><b>${Math.abs(diff)<1?'They come out about the same.':diff>0?`Keeping costs ${money(diff,0)} less`:`Replacing costs ${money(-diff,0)} less`}</b>${Math.abs(diff)<1?'':` over ${plural(H,'year')}`}. The break-even repair cost is <b>${be>0?money(be,0):'$0'}</b>: a repair above that makes replacing cheaper, by these numbers.</p>`:''}`};
  F.addEventListener('input',e=>{if(e.target.id==='kc_vid'){fill(e.target.value)}calc()});

function niceMax(v){if(v<=0)return 1;const p=10**Math.floor(Math.log10(v));const n=v/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function topRound(x,y,w,h,r){r=Math.min(r,w/2,h);return`M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}
function drawCharts(){
  document.querySelectorAll('[data-chart]').forEach(el=>{
    const W=Math.max(260,el.clientWidth-24);
    if(el.dataset.chart==='monthly')el.innerHTML=chartMonthly(W);
    if(el.dataset.chart==='mpg')el.innerHTML=chartMpg(W,el.dataset.vid);
  });
}
function chartMonthly(W){
  const ids=scopeIds();const R=rangeBounds(S.settings.range||'year');
  let start=R.from.slice(0,7)+'-01';const endM=R.to.slice(0,7);
  const ms=[];let d=start;while(d.slice(0,7)<=endM&&ms.length<400){ms.push(d.slice(0,7));d=addMonths(d,1)}
  let note='';if(ms.length>24){ms.splice(0,ms.length-24);note='Showing the last 24 months'}
  const e=costEntries(ids,R.from,R.to);
  const data=ms.map(m=>{const o={m,tot:0};for(const g of GROUPS)o[g]=0;return o});const idx={};data.forEach((o,i)=>idx[o.m]=i);
  for(const x of e){const i=idx[x.date.slice(0,7)];if(i!=null){data[i][x.g]+=x.amt;data[i].tot+=x.amt}}
  const H=230,L=46,Rr=6,T=10,B=24,pw=W-L-Rr,ph=H-T-B;
  const mx=niceMax(Math.max(...data.map(o=>o.tot),1));
  const band=pw/data.length,bw=Math.min(24,Math.max(4,band*0.62));
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Monthly spending by category: ${esc(money(data.reduce((a,o)=>a+o.tot,0),0))} over ${data.length} months. Category totals are listed under Where the money goes.">`;
  for(let k=0;k<=4;k++){const v=mx*k/4,y=T+ph-ph*k/4;s+=`<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/><text class="axis" x="${L-8}" y="${y+3.5}" text-anchor="end">${moneyC(v)}</text>`}
  const every=Math.ceil(data.length/(W<500?6:12));
  data.forEach((o,i)=>{
    const x=L+band*i+(band-bw)/2;let y=T+ph;
    const segs=GROUPS.filter(g=>o[g]>0);s+=`<g class="col" style="animation-delay:${Math.min(i*4,60)}ms">`;
    segs.forEach((g,j)=>{let h=o[g]/mx*ph;const top=j===segs.length-1;const gap=j>0?2:0;h=Math.max(0,h-gap);y-=h+gap;
      s+=top?`<path d="${topRound(x,y,bw,h,2)}" fill="${GCOL[g]}"/>`:`<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${GCOL[g]}"/>`;});
    s+='</g>';
    if(i%every===0||i===data.length-1&&data.length<=12){const dd=pd(o.m+'-01');s+=`<text class="axis" x="${L+band*i+band/2}" y="${H-6}" text-anchor="middle">${dd.toLocaleDateString(undefined,{month:'short'})}${dd.getMonth()===0||i===0?" ’"+String(dd.getFullYear()).slice(2):''}</text>`}
    const tip=[pd(o.m+'-01').toLocaleDateString(undefined,{month:'long',year:'numeric'})+'|'+money(o.tot,0)].concat(GROUPS.filter(g=>o[g]>0).map(g=>g+'|'+money(o[g],0)+'|'+GCOL[g])).join(';;');
    s+=`<rect x="${L+band*i}" y="${T}" width="${band}" height="${ph}" fill="transparent" data-tip="${esc(tip)}"/>`;
  });
  s+=`<line x1="${L}" x2="${W-Rr}" y1="${T+ph}" y2="${T+ph}" stroke="var(--border-2)" stroke-width="1"/></svg>`;
  return s+(note?`<div class="m muted" style="font-size:12px;padding:4px 4px 0">${note}</div>`:'');
}
function chartMpg(W,vid){
  const v=veh(vid);const p=mpgSeries(vid).sort((a,b)=>a.date.localeCompare(b.date)||a.odo-b.odo);
  const H=210,L=40,Rr=64,T=14,B=24,pw=W-L-Rr,ph=H-T-B;
  const vals=p.map(x=>x.mpg);let lo=Math.min(...vals),hi=Math.max(...vals);const padv=Math.max(1,(hi-lo)*0.15);lo=Math.max(0,Math.floor(lo-padv));hi=Math.ceil(hi+padv);
  const t0=pd(p[0].date).getTime(),t1=Math.max(pd(p[p.length-1].date).getTime(),t0+864e5);
  const X=x=>L+(pd(x.date).getTime()-t0)/(t1-t0)*pw,Y=m=>T+ph-(m-lo)/(hi-lo)*ph;
  const avg=p.reduce((a,b)=>a+b.miles,0)/p.reduce((a,b)=>a+b.gal,0);
  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(effU(v))} over time: average ${avg.toFixed(1)}, latest ${p[p.length-1].mpg.toFixed(1)}, across ${p.length} fill-ups.">`;
  const step=(hi-lo)/4;for(let k=0;k<=4;k++){const m=lo+step*k,y=Y(m);s+=`<line x1="${L}" x2="${L+pw}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text class="axis" x="${L-8}" y="${y+3.5}" text-anchor="end">${m%1?m.toFixed(1):m}</text>`}
  const ticks=W<500?4:6;for(let k=0;k<ticks;k++){const t=t0+(t1-t0)*k/(ticks-1);s+=`<text class="axis" x="${L+pw*k/(ticks-1)}" y="${H-6}" text-anchor="middle">${new Date(t).toLocaleDateString(undefined,{month:'short',year:'2-digit'})}</text>`}
  const ay=Y(avg);s+=`<line x1="${L}" x2="${L+pw}" y1="${ay}" y2="${ay}" stroke="var(--muted)" stroke-width="1" opacity=".6"/><text class="axis" x="${L+pw+6}" y="${ay+3.5}">avg ${avg.toFixed(1)}</text>`;
  s+=`<path d="M${L},${T+ph}${p.map(x=>`L${X(x)},${Y(x.mpg)}`).join('')}L${X(p[p.length-1])},${T+ph}Z" fill="var(--s1)" opacity=".08" class="area"/>`;
  s+=`<path d="${p.map((x,i)=>(i?'L':'M')+X(x)+','+Y(x.mpg)).join('')}" class="line" pathLength="1" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const lp=p[p.length-1];s+=`<circle cx="${X(lp)}" cy="${Y(lp.mpg)}" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>`;
  if(Math.abs(Y(lp.mpg)-ay)>12)s+=`<text class="dlabel" x="${X(lp)+9}" y="${Y(lp.mpg)+4}">${lp.mpg.toFixed(1)}</text>`;
  p.forEach(x=>{const tip=`${fd(x.date)}|${x.mpg.toFixed(1)} ${effU(v)};;Distance|${mi(x.miles)} mi;;Fuel used|${x.gal.toFixed(2)} ${volU(v)}`;
    s+=`<circle cx="${X(x)}" cy="${Y(x.mpg)}" r="12" fill="transparent" data-tip="${esc(tip)}" data-dot="1"/>`});
  return s+'</svg>';
}

function shareVehicle(vid){const v=veh(vid);if(!v)return;
  const all=rangeBounds('all'),miles=milesInRange(vid,all.from,all.to),odo=currentOdo(vid);
  const mp=mpgSeries(vid),avg=mp.length?mp.reduce((a,b)=>a+b.miles,0)/mp.reduce((a,b)=>a+b.gal,0):null;
  const nRec=S.fuel.filter(x=>x.vid===vid).length+S.services.filter(x=>x.vid===vid).length+S.expenses.filter(x=>x.vid===vid).length;
  const cost=costEntries([vid],all.from,all.to).reduce((a,b)=>a+b.amt,0);const since=firstDate(vid);
  const head=odo!=null?mi(odo)+' miles on the clock':plural(nRec,'record')+' logged';

    options:[{id:'veh',label:'Show year, make and model',value:false},{id:'money',label:'Show cost per mile',value:false}],
    build:o=>{const stats=[{label:'Miles tracked',value:miles?mi(miles):'—'}];

function shareFuel(vid){const v=veh(vid);if(!v)return;const s=mpgSeries(vid);if(s.length<2)return;

  const f=S.fuel.filter(x=>x.vid===vid),spend=f.reduce((a,x)=>a+fuelTotal(x),0),gal=f.reduce((a,x)=>a+(+x.gal||0),0);

function parseCSV(t){t=String(t).replace(/^﻿/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}else f+=c}
  row.push(f);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}
const csvStr=v=>{v=String(v??'').trim();return/^'[=+\-@]/.test(v)?v.slice(1):v};

const CSVCOLS={date:/date|day|when/i,odo:/odo|mileage|miles?\b|km/i,gal:/gal|liter|litre|volume|quantity|kwh|qty/i,ppg:/price|per ?gal|unit/i,amount:/total|amount|cost|paid|spent/i,desc:/desc|service|work|item|title|task|category|type of/i,shop:/shop|station|vendor|store|merchant|location|garage/i,notes:/note|comment|memo/i,full:/full|partial/i};
const CSVF={fuel:[['date','Date',1],['odo','Odometer'],['gal','Gallons / kWh',1],['ppg','Price per unit'],['amount','Total cost'],['shop','Station'],['notes','Notes'],['full','Full / partial']],

  expense:[['date','Date',1],['desc','Category'],['amount','Amount',1],['notes','Notes']]};

function csvBuild(rows,kind,map,vid,mb){
  const head=rows[0].map(h=>h.trim().toLowerCase()),body=rows.slice(1);const out={fuel:[],services:[],expenses:[]};let bad=0,dup=0;
  const col=(r,k)=>map[k]>=0?r[map[k]]:'';
  const byName={};for(const v of S.vehicles)byName[vname(v).toLowerCase()]=v.id;
  const catKey=c=>Object.keys(EXP_CATS).find(k=>k.toLowerCase()===String(c).toLowerCase());
  for(const r of body){let k=kind,v=vid;const H=n=>r[head.indexOf(n)];
    if(mb){k={fuel:'fuel',service:'service',repair:'repair',expense:'expense'}[csvStr(H('type')).toLowerCase()];v=byName[csvStr(H('vehicle')).toLowerCase()]||vid}

      if(k==='fuel'){const gal=csvNum(H('quantity'));if(gal==null&&amt==null){bad++;continue}rec={vid:v,date,odo:odo??'',gal:gal??0,ppg:csvNum(H('unit_price'))??'',total:amt??'',full:cat!=='partial',missed:false,station:shop,notes};c='fuel'}
      else if(k==='expense'){if(amt==null){bad++;continue}const ck=catKey(cat)||'Other';rec={vid:v,date,category:ck,amount:amt,repeat:'none',until:'',notes:[ck==='Other'&&cat&&cat!=='Other'?cat:'',notes].filter(Boolean).join(' · ')};c='expenses'}
      else{rec={kind:k,vid:v,date,odo:odo??'',cost:amt??0,shop:shop==='DIY'?'':shop,diy:shop==='DIY',notes,tasks:[],taskNames:[]};if(k==='repair'){rec.title=desc||'Repair';rec.covered=cat==='covered'}else rec.other=desc||'Service';c='services'}}
    else{const amt=csvNum(col(r,'amount')),odo=csvNum(col(r,'odo')),notes=csvStr(col(r,'notes')),shop=csvStr(col(r,'shop')),desc=csvStr(col(r,'desc'));
      if(k==='fuel'){const gal=csvNum(col(r,'gal')),ppg=csvNum(col(r,'ppg'));if(gal==null){bad++;continue}const fl=csvStr(col(r,'full')).toLowerCase();
        rec={vid:v,date,odo:odo??'',gal,ppg:ppg??'',total:amt??(ppg!=null?+(gal*ppg).toFixed(2):''),full:!/^(partial|no|n|false|0)$/.test(fl),missed:false,station:shop,notes};c='fuel'}
      else if(k==='service'){if(!desc){bad++;continue}rec={kind:'service',vid:v,date,odo:odo??'',tasks:[],taskNames:[],other:desc,cost:amt??0,shop,diy:false,notes};c='services'}
      else{if(amt==null){bad++;continue}const ck=catKey(desc)||'Other';rec={vid:v,date,category:ck,amount:amt,repeat:'none',until:'',notes:[ck==='Other'&&desc?desc:'',notes].filter(Boolean).join(' · ')};c='expenses'}}
    const same=[...S[c],...out[c]].some(x=>x.vid===rec.vid&&x.date===rec.date&&(c==='fuel'?(+x.odo===+rec.odo&&+x.gal===+rec.gal):c==='expenses'?(+x.amount===+rec.amount&&x.category===rec.category):((+x.cost||0)===(+rec.cost||0)&&(x.kind==='repair'?x.title===rec.title:workText(x)===workText(rec)))));

function hl(s,toks){s=String(s??'');const low=s.toLowerCase(),mk=new Array(s.length).fill(false);

  let out='',on=false;for(let i=0;i<s.length;i++){if(mk[i]!==on){out+=mk[i]?'<mark>':'</mark>';on=mk[i]}out+=esc(s[i])}return out+(on?'</mark>':'')}

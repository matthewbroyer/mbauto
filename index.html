const FAQ=[
 ['Your data',[
  ['Where is my data stored?','Only in this browser, on this device. There’s no account, and the app never sends your records anywhere.<ul><li>Clearing site data or using a private window erases them.</li><li>Save a backup from the <b>Data</b> menu to stay safe.</li></ul>See <b>Privacy</b> at the bottom of Settings for details.'],
  ['Can I get back something I deleted?','Yes, for 30 days. Go to Settings → <b>Recently deleted</b> and tap Restore. A deleted vehicle comes back with all its records.'],
  ['How do I move my records to another phone or computer?','On the old device, open <b>Data → Save backup now</b> (or Export All (JSON)…). On the new device, open <b>Data → Import Backup (JSON)…</b> and pick that file. If the new device already has records, choose <b>Merge</b> to add what’s missing or <b>Replace</b> for an exact copy.'],
  ['Where does Save backup now put the file?','The first time, your browser asks where to save it. After that, Save backup now (Ctrl/⌘+S) overwrites that same file in one click. Use <b>Change location…</b> in the Data menu to pick another. Browsers only tell the page the file name, not the full folder path. Firefox, Safari and phones can’t pick a location, so there each backup downloads to Downloads with the date in its name.'],
  ['Where are my receipts and photos kept?','In this browser’s IndexedDB storage on this device, next to your records. Big phone photos are shrunk to about 2000 pixels first. Backups include every attachment, so a restore on another device brings them along. Clearing site data removes them.'],
  ['Can I bring in records from a spreadsheet or another app?','Yes. Open <b>Data → Import CSV…</b>, choose whether the rows are fill-ups, services or expenses, and match the columns. A CSV exported from mbauto.online is recognized automatically. Rows that are already here are skipped, and the whole import can be undone.'],
  ['How do I show a buyer or mechanic the car’s history?','Open <b>History → Vehicle history report</b>, pick what to include, then choose <b>Save as PDF</b> in the print window. Leave out costs, the plate and notes if you’d rather not share them.'],
  ['Can I install it like an app?','Yes. In Chrome or Edge, use <b>Install</b> in Settings, or the install icon in the address bar. On iPhone or iPad, tap <b>Share</b>, then <b>Add to Home Screen</b>. It opens in its own window as <b>Auto</b> and works offline after the first visit.'],
  ['What goes into a Share image?','Only what the preview shows. The image is made on your device and nothing is uploaded. Your vehicle’s year, make and model and any money amounts stay off it unless you switch them on. The plate, VIN, nickname and notes are never included.'],
  ['Does mbauto.online use cookies or tracking?','No cookies, analytics or ads. Your records sit in the browser’s local storage. After the page loads, the app makes no network requests.']]],
 ['Fuel',[
  ['How is MPG calculated?','Between two fill-ups marked <b>Filled the tank completely</b>: the miles between those odometer readings divided by all the fuel added since the previous full tank (partial fills included). Partial fill-ups don’t show MPG on their own row.'],
  ['What if I forget to log a fill-up?','On the next one you log, tick <b>I missed logging the previous fill-up</b>. That restarts the calculation so one missing entry doesn’t produce an inflated MPG.']]],
 ['Maintenance',[
  ['How do reminders work?','Each reminder has a mileage interval, a time interval, or both. Whichever comes first sets the due date. Log a service and tick the reminder, and its countdown restarts from that date and odometer reading.'],
  ['What does “Due soon” mean?','Any one of these:<ul><li>Within 30 days of the due date</li><li>Within 10% of the mileage interval (or 300 mi, whichever is more)</li><li>On pace to hit the due mileage within 30 days, based on your average daily miles</li></ul>'],
  ['How is the cost forecast worked out?','For each reminder with a history, mbauto.online projects when it comes due from your interval and average daily miles, then adds its cost: the typical cost you set on the reminder, or the average of what you paid the last few times. Recurring bills like insurance are added on their dates. Tasks with no cost yet are listed but not totaled. Surprise repairs aren’t predicted.'],
  ['Are the default intervals right for my vehicle?','Not always. They’re generic starting points. Edit each reminder to match your owner’s manual, since intervals vary a lot by vehicle and driving conditions.']]],
 ['Repairs & problems',[
  ['What’s the difference between “Code reader” and “Mechanic confirmed”?','A code reader or app reports a trouble code and lists possible causes. That’s a starting point, not a diagnosis; the same code can come from several different faults. Mark a problem “Mechanic confirmed” only when a shop has inspected it.'],
  ['How do repair quotes work?','Add each shop’s estimate under the same job name. They’re shown side by side, cheapest first, with missing parts, labor or warranty details flagged. Tap <b>Use this one</b> to turn a quote into a repair record.']]],
 ['Costs',[
  ['What counts toward cost of ownership?','Fuel, services, repairs (except ones marked covered by warranty or insurance, or done before you owned it) and expenses. The purchase price isn’t counted as spending; if you add an estimated current value in Garage, depreciation is shown separately under <b>All time</b>.'],
  ['How is cost per mile worked out?','Total spent in the selected range divided by miles driven in that range. Miles come from every odometer reading you log: fill-ups, services, repairs and odometer updates. The more you log, the more accurate it gets.'],
  ['Why is “Ownership cost” different from cash paid?','Cash paid is what left your pocket. Ownership cost (shown under All time when you’ve entered a purchase price and current value) adds depreciation, the value the vehicle has lost. Loan payments are taken out of that figure because they pay off the same purchase price; counting both would double it. Loan interest is left out too.'],
  ['How do repeating expenses work?','Enter the first payment date and how often it repeats. Each occurrence counts on its date, up to today or the “Repeat until” date. If the amount changes, set a “Repeat until” date on the old one and add a new expense. Editing the amount changes past payments too.']]]
];
function faqHTML(){return`<div class="card mt faq" id="faq"><div class="card-h"><div><h2>Help & FAQ</h2><div class="sub">How mbauto.online works</div></div><button class="btn sm ghost" data-act="faqAll">Expand all</button></div>${FAQ.map(([sec,qs])=>`<div class="faq-sec">${esc(sec)}</div>${qs.map(([q,a])=>`<details><summary>${esc(q)}${ic('chev')}</summary><div class="a">${a}</div></details>`).join('')}`).join('')}</div>`}

/* ================= onboarding ================= */
const OBT=[['Car','Gasoline','Car','car'],['SUV','Gasoline','SUV','car'],['Truck','Gasoline','Truck','truck'],['Motorcycle','Gasoline','Motorcycle','bike'],['Car','Electric','Electric car','car'],['Van','Gasoline','Van','truck']];
const MAKES=['Acura','Audi','BMW','Buick','Cadillac','Chevrolet','Chrysler','Dodge','Ducati','Ford','GMC','Harley-Davidson','Honda','Hyundai','Jeep','Kawasaki','Kia','Lexus','Mazda','Mercedes-Benz','Mini','Mitsubishi','Nissan','Ram','Rivian','Subaru','Suzuki','Tesla','Toyota','Volkswagen','Volvo','Yamaha'];
function vOnboard(){
  const st=OB.step,d=OB.d,cy=new Date().getFullYear();
  const prog=st<3?`<div class="ob-prog"><div class="ob-top"><span>Step ${st+1} of 3</span><button class="btn sm ghost" data-act="obCancel">Cancel</button></div><div class="ob-bar"><span style="width:${(st+1)/3*100}%"></span></div></div>`:'';
  const back=`<button type="button" class="btn ghost" data-act="obBack">Back</button>`;
  let b='';
  if(st===0)b=`<h1>What do you drive?</h1><p class="sub">Pick one. You can change it later.</p>
    <div class="obtiles">${OBT.map(([t,f,l,i])=>`<button data-act="obType" data-t="${t}" data-f="${f}" data-l="${l}" class="${d.label===l?'on':''}">${ic(i)}<span>${l}</span></button>`).join('')}</div>`;
  if(st===1)b=`<h1>Which ${esc(d.label.toLowerCase())}?</h1><p class="sub">Year, make and model. That’s it.</p>
    <form id="obForm" class="ob-form" novalidate>
      <div class="fld"><label for="ob_year">Year</label><input id="ob_year" name="year" type="number" inputmode="numeric" min="1900" max="${cy+1}" placeholder="e.g. ${cy-5}" value="${esc(d.year||'')}"></div>
      <div class="fld"><label for="ob_make">Make</label><input id="ob_make" name="make" type="text" list="ob_makes" autocomplete="off" placeholder="e.g. Honda" value="${esc(d.make||'')}"><datalist id="ob_makes">${MAKES.map(m=>`<option value="${m}">`).join('')}</datalist></div>
      <div class="fld"><label for="ob_model">Model</label><input id="ob_model" name="model" type="text" autocomplete="off" placeholder="e.g. Civic" value="${esc(d.model||'')}"></div>
      <div class="ob-err" id="obErr" role="alert"></div>
      <div class="ob-acts">${back}<button type="submit" class="btn pri">Continue${ic('chevr')}</button></div></form>`;
  if(st===2){const what=d.type==='Motorcycle'?'Oil, chain, tires, inspection and more.':d.fuelType==='Electric'?'Tire rotations, brakes, inspection and more.':'Oil changes, tire rotations, inspection and more.';
    b=`<h1>What does the odometer say?</h1><p class="sub">Check the dash. A close guess works.</p>
    <form id="obForm" class="ob-form" novalidate>
      <div class="fld"><label for="ob_odo">Odometer</label><div class="ob-odo"><input id="ob_odo" name="odo" type="number" inputmode="numeric" min="0" placeholder="e.g. 48200" value="${esc(d.odo??'')}"><span>mi</span></div></div>
      <label class="chk ob-chk"><input type="checkbox" name="sched" ${d.sched?'checked':''}><span><b>Add a standard maintenance schedule</b><small>${what} Edit it anytime.</small></span></label>
      <div class="ob-err" id="obErr" role="alert"></div>
      <div class="ob-acts">${back}<button type="submit" class="btn pri">Finish setup${ic('check')}</button></div></form>`}
  if(st===3){const v=veh(OB.vid);
    b=`<div class="ob-done">${ic('check')}</div><h1>Your ${esc(vname(v))} is ready</h1>
    <p class="sub">${OB.n?plural(OB.n,'maintenance reminder')+' added. ':''}Tracking starts at ${mi(currentOdo(v.id))} mi.</p>
    <div class="ob-next"><b>Next step</b>Log your next fill-up. After two full tanks you’ll see your ${isEV(v)?'mi/kWh':'MPG'}.</div>
    <div class="ob-acts"><button class="btn" data-act="obDone">Go to overview</button><button class="btn pri" data-act="obFuel">${ic('fuel')}Log a fill-up</button></div>`}
  return`<div class="card ob">${prog}${b}</div>`;
}
function obFocus(){const i=document.querySelector('#obForm input:not([type=checkbox])');if(i&&matchMedia('(pointer:fine)').matches)i.focus()}
function obNext(f){
  const d=OB.d,err=f.querySelector('#obErr');
  const bad=(el,m)=>{f.querySelectorAll('.fld').forEach(x=>x.classList.remove('err'));f.querySelectorAll('[aria-invalid]').forEach(x=>x.removeAttribute('aria-invalid'));el.closest('.fld').classList.add('err');el.setAttribute('aria-invalid','true');el.setAttribute('aria-describedby','obErr');err.textContent=m;el.focus()};
  if(OB.step===1){const y=f.year.value.trim(),mk=f.make.value.trim(),md=f.model.value.trim(),cy=new Date().getFullYear();
    if(!y||isNaN(+y)||+y<1900||+y>cy+1)return bad(f.year,`Enter a year between 1900 and ${cy+1}.`);
    if(!mk)return bad(f.make,'Enter the make, like Honda or Ford.');
    if(!md)return bad(f.model,'Enter the model, like Civic or F-150.');
    Object.assign(d,{year:String(Math.round(+y)),make:mk,model:md});OB.step=2;render();return}
  if(OB.step===2){const o=f.odo.value.trim();
    if(o===''||isNaN(+o)||+o<0)return bad(f.odo,'Enter the number on your odometer.');
    d.odo=Math.round(+o);d.sched=f.sched.checked;
    const v={id:uid(),name:'',year:d.year,type:d.type,make:d.make,model:d.model,trim:'',fuelType:d.fuelType,plate:'',vin:'',purchaseDate:'',purchasePrice:'',startOdo:d.odo,currentValue:'',notes:''};
    S.vehicles.push(v);OB.n=d.sched?addDefaultSchedule(v):0;S.odo.push({id:uid(),vid:v.id,date:today(),odo:d.odo});
    S.settings.active=v.id;S.settings.view='dash';save();OB.vid=v.id;OB.step=3;render()}
}
document.addEventListener('submit',e=>{if(e.target.id==='obForm'){e.preventDefault();obNext(e.target)}});
document.addEventListener('input',e=>{const f=e.target.closest&&e.target.closest('#obForm');if(f){const fl=e.target.closest('.fld');if(fl)fl.classList.remove('err');const er=f.querySelector('#obErr');if(er)er.textContent=''}});

/* setup checklist: first step is already done, so progress starts above zero */
function checklist(){
  if(S.settings.checklistHidden)return'';
  const it=[['Add your vehicle',S.vehicles.length>0,''],['Log a fill-up',S.fuel.length>0,'fuel'],['Log a service',S.services.some(s=>s.kind!=='repair'),'service'],['Add insurance or registration',S.expenses.length>0,'expense']];
  const n=it.filter(x=>x[1]).length,next=it.findIndex(x=>!x[1]);
  if(n===it.length)return`<div class="card cl-done"><div class="ob-done sm">${ic('check')}</div><div class="main"><div class="t">Setup complete</div><div class="m">Costs, fuel economy and reminders are all tracking.</div></div><button class="btn pri" data-act="hideChecklist">Done</button></div>`;
  return`<div class="card cl"><div class="card-h"><div><h2>Finish setting up</h2><div class="sub">${n} of ${it.length} done</div></div><button class="btn sm ghost" data-act="hideChecklist">Hide</button></div>
    <div class="ob-bar cl-bar"><span style="width:${n/it.length*100}%"></span></div>
    <div class="rows">${it.map(([t,dn,k],i)=>dn?`<div class="row cl-row done"><span class="cl-ic">${ic('check')}</span><div class="main"><span class="t">${t}</span></div></div>`:`<button class="row click cl-row" data-act="add" data-k="${k}"><span class="cl-ic"></span><div class="main"><span class="t">${t}</span></div>${i===next?'<span class="pill neutral">Next</span>':''}${ic('chevr')}</button>`).join('')}</div></div>`;
}
function alertBar(rems){
  const o=rems.filter(x=>x.s.state==='over');if(!o.length)return'';const f=o[0];
  return`<div class="card alertbar"><div class="ic bad">${ic('alert')}</div><div class="main"><div class="t">${esc(f.r.task)} is overdue</div><div class="m">${esc(f.s.label)}${vtag(f.r.vid)}${o.length>1?` · ${o.length-1} more overdue`:''}</div></div><button class="btn pri" data-act="logRem" data-id="${esc(f.r.id)}">${ic('check')}Log it</button></div>`;
}

/* ================= scroll progress + back to top ================= */
function onScroll(){const h=document.documentElement,max=h.scrollHeight-h.clientHeight,y=h.scrollTop||document.body.scrollTop;
  $('#progress').style.width=(max>4?Math.min(100,y/max*100):0)+'%';$('#totop').classList.toggle('on',y>500)}
addEventListener('scroll',onScroll,{passive:true});
$('#totop').addEventListener('click',()=>scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));

/* ================= storage notice ================= */
const NOTICE_KEY='mbauto.notice';
function setNoticeH(){const n=$('#notice');document.documentElement.style.setProperty('--notice-h',n.hidden?'0px':(n.offsetHeight+10)+'px')}
function hideNotice(){try{localStorage.setItem(NOTICE_KEY,'1')}catch(e){}$('#notice').hidden=true;setNoticeH()}
(function(){let seen=false;try{seen=localStorage.getItem(NOTICE_KEY)==='1'}catch(e){}if(!seen){$('#notice').hidden=false;requestAnimationFrame(setNoticeH)}})();
addEventListener('resize',setNoticeH);
$('#noticeOk').addEventListener('click',hideNotice);
$('#noticeMore').addEventListener('click',()=>{hideNotice();A.view({v:'privacy'})});

  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const D=blank();D.settings=Object.assign({},S.settings,{active:'all',view:'dash',checklistHidden:true});
